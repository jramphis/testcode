[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-donor-pipeline"
version = "0.1.0"
description = "Identify the largest individual donor in Puerto Rico across 2016-2024 election cycles using OCE filings."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pr-donors = "pr_donor_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
